ServerName localhost

<Directory /var/www/html/public>
    Options FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Docker passes these in; make sure PHP (mod_php) can read them.
PassEnv APP_URL APP_ENV APP_SECRET
PassEnv TWITCH_CLIENT_ID TWITCH_CLIENT_SECRET ADMIN_TWITCH_LOGINS RESTRICT_LOGIN_TO_ADMINS
PassEnv DB_HOST DB_PORT DB_NAME DB_USER DB_PASS
