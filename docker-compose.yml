# Local development. Code is bind-mounted; the database lives in the `db_data` volume.
#   docker compose up --build
#   docker compose down        # add -v to drop the database

services:
  app:
    build: .
    expose:
      - "80"
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    environment:
      # APP_URL comes from .env (https://localhost via the proxy service).
      APP_ENV: development
      # Overrides the host-oriented DB_* values in .env.
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: twitch_alerter
      DB_USER: root
      DB_PASS: root
    depends_on:
      db:
        condition: service_healthy

  proxy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  db:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: twitch_alerter
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  db_data:
  caddy_data:
  caddy_config:
